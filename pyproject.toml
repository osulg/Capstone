[project]
name = "guardfs"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "W",  # pycodestyle warnings
    "I",  # import 정렬
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"